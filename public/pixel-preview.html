<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素角色動作對照</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #f9eee4; background: #211d27; font: 15px/1.6 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0; } p { color: #cbbfcf; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
  button { border: 1px solid #75667b; border-radius: 8px; padding: 10px 16px; background: #392c40; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #875c76; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 1400px; }
  article { background: #302936; border: 1px solid #534559; border-radius: 12px; padding: 14px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  figure { margin: 0; min-width: 0; }
  figcaption { text-align: center; color: #cbbfcf; }
  img, canvas { display: block; width: 100%; height: 340px; object-fit: contain; image-rendering: pixelated; }
  @media (max-width: 700px) { body { padding: 12px; } main { grid-template-columns: 1fr; } img, canvas { height: 300px; } }
</style>
<h1>像素角色動作對照</h1>
<p>左側為 v2 原圖，右側為可動模型。選擇動作後四個角色同步播放；暫停可檢查每一個姿勢。</p>
<div class="controls" id="actions"></div>
<div class="controls"><button id="pause">暫停</button><label>動作進度 <input id="scrub" type="range" min="0" max="100" value="0"></label></div>
<main id="cast"></main>
<script type="module">
import { CHARACTERS } from './js/characters.js';
import { ACTIONS, WIDTH, HEIGHT, drawModel, poseAt } from './js/pixel-model.js?v=26';
const labels = { idle: '待機', wave: '揮手', dance: '跳舞', hop: '跳躍', stretch: '伸懶腰', bow: '鞠躬', kick: '踢腿' };
let action = 'idle', paused = false, started = performance.now(), progress = 0;
const cast = CHARACTERS.filter(c => c.visible).map(spec => {
  const article = document.createElement('article');
  article.innerHTML = `<h2>${spec.name['zh-TW'] || spec.name.en}</h2><div class="pair"><figure><img src="./assets/pixel-${spec.id}-v2.png" alt="${spec.name.en} v2 原圖"><figcaption>v2 原圖</figcaption></figure><figure><canvas width="${WIDTH}" height="${HEIGHT}" aria-label="${spec.name.en} 可動模型"></canvas><figcaption>可動模型</figcaption></figure></div>`;
  document.querySelector('#cast').append(article);
  const ctx = article.querySelector('canvas').getContext('2d');
  return { spec, ctx, buffer: ctx.createImageData(WIDTH, HEIGHT) };
});
for (const name of ['idle', ...ACTIONS]) {
  const button = document.createElement('button');
  button.textContent = labels[name]; button.setAttribute('aria-pressed', name === action);
  button.onclick = () => {
    action = name; started = performance.now(); progress = 0;
    for (const other of document.querySelectorAll('#actions button')) other.setAttribute('aria-pressed', other === button);
  };
  document.querySelector('#actions').append(button);
}
const pause = document.querySelector('#pause'), scrub = document.querySelector('#scrub');
pause.onclick = () => { paused = !paused; started = performance.now() - progress * 2100; pause.textContent = paused ? '播放' : '暫停'; };
scrub.oninput = () => { paused = true; pause.textContent = '播放'; progress = Number(scrub.value) / 100; };
let previous = -Infinity;
function frame(time) {
  if (time - previous > 1000 / 16) {
    previous = time;
    if (!paused) { progress = ((time - started) % 2600) / 2100; scrub.value = Math.min(100, progress * 100); }
    for (const { spec, ctx, buffer } of cast) drawModel(spec, poseAt(action === 'idle' ? null : action, Math.min(1, progress), paused ? 0 : time / 1000, paused)).paint(ctx, buffer);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
